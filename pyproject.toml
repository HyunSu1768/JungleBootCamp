[project]
name = "jungle-bootcamp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "numpy>=2.0",
    "yt-dlp>=2026.1.1",
    # 받아쓰기: Apple 실리콘은 mlx, 그 밖(Windows)은 faster-whisper
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.1.0; sys_platform != 'darwin'",
    "opencv-python-headless>=4.10",
]
