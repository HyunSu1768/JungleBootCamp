# main에 올라오면 Windows 설치 파일을 만들어 GitHub 릴리스로 낸다.
# 설치된 앱(electron-updater)은 이 릴리스를 보고 스스로 업데이트한다.
name: release

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"   # 앱(desktop/main.js)과 같은 조건: 한글 JSON, 로그를 UTF-8로
      UV_PYTHON: "3.12"
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - uses: astral-sh/setup-uv@v6

      - name: 버전 정하기 (package.json의 앞 두 자리 + 실행 번호)
        shell: bash
        run: |
          BASE=$(node -p "require('./desktop/package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd desktop && npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: 웹 화면 빌드
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 앱에 넣을 uv, ffmpeg 준비
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/vendor/ffmpeg | Out-Null
          Copy-Item (Get-Command uv).Source desktop/vendor/uv.exe
          # BtbN 빌드: ddagrab(화면 캡처), NVENC/AMF/QSV(그래픽카드 인코더) 포함
          $urls = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.0-latest-win64-gpl-8.0.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )
          foreach ($u in $urls) {
            try { Invoke-WebRequest $u -OutFile ffmpeg.zip; break } catch { Write-Host "실패: $u" }
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-x
          $bin = Get-ChildItem ffmpeg-x -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName desktop/vendor/ffmpeg/
          Copy-Item (Join-Path $bin.DirectoryName ffprobe.exe) desktop/vendor/ffmpeg/
          desktop/vendor/ffmpeg/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: 파이썬 의존성 (Windows에서 실제로 설치되는지)
        run: |
          uv lock --check
          uv sync --frozen --no-dev
          uv pip install httpx pytest

      - name: 단위 테스트 (조각 합치기, 복기 잠금, 목표, 공유 콘텐츠, 큐 막기)
        env:
          PYTHONUTF8: "1"
        run: uv run --no-sync python -m pytest tests -q

      - name: 스모크 테스트
        shell: pwsh
        env:
          FFMPEG: ${{ github.workspace }}/desktop/vendor/ffmpeg/ffmpeg.exe
        run: |
          # 앱과 같은 조건: 앱에 든 ffmpeg가 PATH 맨 앞 (desktop/main.js baseEnv)
          $env:PATH = "${{ github.workspace }}\desktop\vendor\ffmpeg;" + $env:PATH
          uv run --no-sync python desktop/ci/smoke.py

      # 초안 릴리스를 먼저 만들고(파일을 동시에 올릴 때 릴리스가 두 번 생기는 문제 방지),
      # 설치 파일, latest.yml, blockmap을 다 올린 뒤에 공개한다. 설치된 앱은 공개된 릴리스만 본다
      - name: 초안 릴리스 만들기
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "$(git log -1 --pretty=%B | sed '/^Co-Authored-By/d')"

      - name: 설치 파일 빌드, 올리기
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npx electron-builder --win --publish always

      - name: 릴리스 공개
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v$VERSION" --json assets -q '.assets[].name'
          gh release view "v$VERSION" --json assets -q '.assets[].name' | grep -qx latest.yml
          gh release edit "v$VERSION" --draft=false --latest

      - name: 실패하면 초안 정리
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "v$VERSION" --yes --cleanup-tag || true
